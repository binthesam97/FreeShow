appId: app.kerusso
productName: Kerusso
artifactName: Kerusso-${version}-${arch}.${ext}

files:
    - build/electron/**
    - build/types/**
    - public/**
    - "!node_modules/@napi-rs"

beforePack: scripts/bundleR2Assets.js

extraResources:
    - from: node_modules/slideshow/
      to: slideshow
      filter:
          - connector-*
    - from: public/songBooks
      to: songBooks
      filter:
          - "*.json"
    - from: public/localBible
      to: localBible
      filter:
          - "*.xml"
          - "*.json"
          - "*.fsb"

# linux

linux:
    asarUnpack:
        - "**/node_modules/grandiose/**"
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libltc-wrapper/**/*"
    category: AudioVideo
    target:
        - AppImage
        - deb
        - rpm
    icon: build/public

deb:
    depends:
        - libfontconfig1
        - uuid-runtime
        - libltc11
